<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindly — Social scheduling for good</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf8;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #9c8bff;outline-offset:2px}.app{display:flex;min-height:100vh}.side{width:248px;background:#10172a;border-right:1px solid #263049;padding:28px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{font-size:25px;font-weight:850;letter-spacing:-1px;padding:3px 12px 34px}.logo span{color:#a595ff}.sub{color:#8f9bb6;font-size:11px;letter-spacing:1.6px;font-weight:800;padding:0 13px 10px}.nav{width:100%;border:0;background:transparent;color:#aab6ce;text-align:left;padding:13px 15px;border-radius:11px;margin:3px 0;font-weight:650}.nav.active,.nav:hover{background:#292c53;color:white}.sidefoot{margin-top:auto;padding:15px 12px;color:#96a4c1;font-size:12px;line-height:1.7;border-top:1px solid #2a344b}.main{flex:1;min-width:0;padding:37px max(25px,4vw) 70px;max-width:1650px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:29px}.eyebrow{color:#a99cff;font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.top h1{font-size:clamp(27px,3vw,39px);letter-spacing:-1.4px;margin:6px 0}.muted{color:#97a6c2}.btn{border:1px solid #35415e;border-radius:11px;background:#1b2640;color:#eaf0fc;padding:11px 16px;font-weight:700}.btn:hover{filter:brightness(1.18)}.primary{background:#8976f5;border-color:#8976f5;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:23px}.card{background:#151e33;border:1px solid #2b3750;border-radius:17px;padding:21px}.stat label{font-size:13px;color:#9aa8c4}.stat strong{display:block;font-size:33px;margin:12px 0 3px;letter-spacing:-1px}.stat small{color:#b0b9d0}.two{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.sectionhead h2{font-size:18px;margin:0}.list{display:grid;gap:11px}.post{border:1px solid #2c3852;background:#111a2e;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}.post p{margin:7px 0;color:#e1e7f3;line-height:1.5}.post small{color:#9aabc8}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;border-radius:7px;padding:4px 7px;background:#283653;color:#c9d5ee;font-size:11px;font-weight:750}.status{font-size:11px;font-weight:800;padding:5px 8px;border-radius:20px;white-space:nowrap}.scheduled{background:#2c2b59;color:#c4b9ff}.draft{background:#384054;color:#c4ccdc}.published{background:#174b40;color:#82e6b9}.failed{background:#552c39;color:#ffb0c4}.empty{padding:40px;text-align:center;color:#a6b4d0;border:1px dashed #3c4760;border-radius:13px}.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{text-align:center;color:#9eabc4;font-size:12px;font-weight:800;padding:9px}.day{min-height:105px;border:1px solid #2e3a53;background:#111a2d;border-radius:10px;padding:9px;overflow:hidden}.day.other{opacity:.32}.day.today{border-color:#9789ff}.daynum{font-size:12px;color:#b6c5dd;font-weight:800}.event{margin-top:7px;font-size:10px;padding:6px;border-radius:6px;background:#343264;color:#e0d9ff;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin-bottom:19px}.field label{color:#cdd6e9;font-size:13px;font-weight:700}.field input,.field textarea,.field select{background:#10182a;border:1px solid #38445f;color:#eef3ff;border-radius:10px;padding:12px;width:100%}.field textarea{min-height:125px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:10px}.check{background:#10192b;border:1px solid #38435c;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:8px;font-size:13px}.check input{accent-color:#9788ff}.notice{background:#282844;border:1px solid #48406b;color:#d7d1ff;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;margin-bottom:20px}.toast{position:fixed;bottom:25px;right:25px;background:#30365a;border:1px solid #7c74bd;border-radius:12px;padding:14px 20px;z-index:5;box-shadow:0 12px 40px #0008}.hide{display:none!important}.pill{border-radius:999px;padding:5px 10px;background:#25334b;color:#c6d1e7;font-size:12px}.bar{height:9px;border-radius:10px;background:#29334b;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#9282f7}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px;padding:8px 10px}.mobiletop{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.side{width:195px}.main{padding:27px 20px}}@media(max-width:650px){.app{display:block}.side{position:static;height:auto;width:100%;padding:12px;display:block}.logo{padding:5px 8px}.sub,.sidefoot{display:none}.nav{width:auto;padding:9px;font-size:12px}.main{padding:22px 12px}.top{align-items:flex-start;flex-wrap:wrap}.stats{gap:8px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.day{min-height:70px;padding:4px}.event{font-size:8px;padding:3px}.grid7{gap:3px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">✳ kindly<span>.</span></div><div class="sub">WORKSPACE</div><button class="nav active" data-view="dashboard">◫ &nbsp; Overview</button><button class="nav" data-view="calendar">▦ &nbsp; Content calendar</button><button class="nav" data-view="posts">▤ &nbsp; All posts</button><button class="nav" data-view="compose">✎ &nbsp; Create a post</button><button class="nav" data-view="analytics">◷ &nbsp; Insights</button><button class="nav" data-view="settings">⚙ &nbsp; Settings</button><div class="sidefoot">✳ Made for small charities<br>Local demo • No real social accounts connected</div></aside><main class="main"><header class="top"><div><div class="eyebrow">CHARITY SOCIAL STUDIO</div><h1 id="pageTitle">Your content, in good hands.</h1><div class="muted" id="subtitle">Plan meaningful updates without the last-minute rush.</div></div><button class="btn primary" id="newPost">＋ Create post</button></header><div id="content"></div></main></div><div id="toast" class="toast hide"></div><script>
const KEY='kindly-posts-v1', SETTINGS='kindly-settings-v1';let posts=read(KEY,[]),settings=read(SETTINGS,{charity:'Hope Community Charity'}),view='dashboard',editing=null,month=new Date();const platforms=['Instagram','Facebook','LinkedIn','X'];function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem(KEY,JSON.stringify(posts))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function dateLocal(d){const n=new Date(d);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}T${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`}function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),3000)}function counts(){return {scheduled:posts.filter(p=>p.status==='scheduled').length,draft:posts.filter(p=>p.status==='draft').length,published:posts.filter(p=>p.status==='published').length,failed:posts.filter(p=>p.status==='failed').length}}function title(t,s){document.getElementById('pageTitle').textContent=t;document.getElementById('subtitle').textContent=s}function badge(p){return `<span class="status ${p.status}">${esc(p.status)}</span>`}function postRow(p){return `<div class="post"><div style="min-width:0;flex:1"><div class="chips">${p.platforms.map(x=>`<span class="chip">${esc(x)}</span>`).join('')} ${badge(p)}</div><p>${esc(p.caption).slice(0,180)||'<i>No caption</i>'}</p><small>${p.date?fmt(p.date):'No date'} · ${p.image?'Image attached · ':''}${esc(p.note||'')}</small></div><div class="actions"><button class="btn" data-edit="${p.id}">Edit</button><button class="btn" data-delete="${p.id}">Delete</button></div></div>`}function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));const c=document.getElementById('content'),n=counts();if(view==='dashboard'){title('Your content, in good hands.','Plan meaningful updates without the last-minute rush.');const next=posts.filter(p=>p.status==='scheduled').sort((a,b)=>new Date(a.date)-new Date(b.date));c.innerHTML=`<div class="stats">${[['Scheduled',n.scheduled,'Ready in your content plan'],['Drafts',n.draft,'Ideas waiting to be shared'],['Published',n.published,'Manually confirmed'],['Platforms',new Set(posts.flatMap(p=>p.platforms)).size,'Included in your posts']].map(([a,b,d])=>`<div class="card stat"><label>${a}</label><strong>${b}</strong><small>${d}</small></div>`).join('')}</div><div class="notice">✦ <b>Prototype mode:</b> Scheduled posts are planned and saved in this browser. They are <b>not automatically published</b> to social media. Use “Mark published” after posting manually. Real auto-publishing requires authorized platform APIs and a secure server.</div><div class="two"><section class="card"><div class="sectionhead"><h2>Upcoming posts</h2><button class="btn" data-go="posts">View all</button></div><div class="list">${next.length?next.slice(0,5).map(postRow).join(''):'<div class="empty">Nothing scheduled yet. Create your first post to get started.</div>'}</div></section><section class="card"><div class="sectionhead"><h2>Quick start</h2></div><p class="muted" style="line-height:1.8">Write your message, choose the platforms, add an image, and pick a date. Build a whole week of content in one sitting.</p><button class="btn primary" data-go="compose">Create a post →</button><hr style="border:0;border-top:1px solid #33405a;margin:24px 0"><h2 style="font-size:16px">Your workflow</h2><p class="muted">① Draft → ② Schedule → ③ Publish manually → ④ Mark complete</p></section></div>`}else if(view==='calendar'){title('Content calendar','See your entire month of social content at a glance.');const y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1),offset=(start.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<42;i++){let d=i-offset+1,actual=new Date(y,m,d),items=posts.filter(p=>p.date&&new Date(p.date).toDateString()===actual.toDateString());cells+=`<div class="day ${d<1||d>days?'other':''} ${actual.toDateString()===new Date().toDateString()?'today':''}"><div class="daynum">${actual.getDate()}</div>${items.map(p=>`<div class="event" data-edit="${p.id}" title="${esc(p.caption)}">${esc(p.caption).slice(0,24)}</div>`).join('')}</div>`}c.innerHTML=`<div class="card"><div class="sectionhead"><h2>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><div class="actions"><button class="btn" id="prevMonth">←</button><button class="btn" id="todayMonth">Today</button><button class="btn" id="nextMonth">→</button></div></div><div class="grid7">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></div>`}else if(view==='posts'){title('All your posts','Manage every idea, draft, and scheduled update.');c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Content library (${posts.length})</h2><select id="filter" class="btn"><option value="all">All statuses</option><option value="scheduled">Scheduled</option><option value="draft">Drafts</option><option value="published">Published</option><option value="failed">Needs attention</option></select></div><div id="postList" class="list"></div></div>`;drawPosts()}else if(view==='compose'){title(editing?'Edit your post':'Create something meaningful','One message, multiple platforms, a plan that works.');const p=posts.find(p=>p.id===editing)||{caption:'',platforms:['Instagram','Facebook'],date:dateLocal(new Date(Date.now()+86400000)),status:'scheduled',image:'',note:''};c.innerHTML=`<div class="two"><section class="card"><form id="postForm"><div class="field"><label for="caption">Post caption</label><textarea id="caption" maxlength="2200" required placeholder="Share an update, tell a story, or celebrate your community...">${esc(p.caption)}</textarea><small class="muted" id="charcount">${p.caption.length} / 2200 characters</small></div><div class="field"><label>Choose platforms</label><div class="checks">${platforms.map(x=>`<label class="check"><input type="checkbox" name="platform" value="${x}" ${p.platforms.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="formgrid"><div class="field"><label for="date">Publish date and time</label><input type="datetime-local" id="date" value="${esc(dateLocal(p.date||new Date()))}"></div><div class="field"><label for="status">Post status</label><select id="status"><option value="scheduled" ${p.status==='scheduled'?'selected':''}>Scheduled (planning only)</option><option value="draft" ${p.status==='draft'?'selected':''}>Draft</option><option value="published" ${p.status==='published'?'selected':''}>Published manually</option><option value="failed" ${p.status==='failed'?'selected':''}>Needs attention</option></select></div></div><div class="field"><label for="image">Image attachment (saved locally, small files only)</label><input type="file" id="image" accept="image/*"><small class="muted">Images are stored in this browser, not uploaded to a server. Large files may exceed browser storage.</small></div><div class="field"><label for="note">Internal notes</label><input id="note" placeholder="Campaign, reminder, or volunteer instructions" value="${esc(p.note)}"></div><div class="actions"><button type="submit" class="btn primary">${editing?'Save changes':'Save post'}</button><button type="button" class="btn" data-go="posts">Cancel</button></div></form></section><section class="card"><div class="sectionhead"><h2>Live preview</h2><span class="pill">Preview</span></div><div style="background:#10182b;border:1px solid #35415b;padding:17px;border-radius:14px"><strong>✳ ${esc(settings.charity)}</strong><p id="previewCaption" style="white-space:pre-wrap;line-height:1.65">${esc(p.caption)||'Your post preview appears here...'}</p><img id="previewImage" class="preview ${p.image?'':'hide'}" src="${p.image||''}" alt="Attached post image"><div class="muted" style="font-size:12px;margin-top:15px">♡ &nbsp; ◯ &nbsp; ↗</div></div><p class="muted" style="font-size:12px;line-height:1.7">Preview is illustrative. Platform layouts and limits may vary. Video upload and automatic publishing are not included in this static prototype.</p></section></div>`;document.getElementById('caption').addEventListener('input',e=>{document.getElementById('previewCaption').textContent=e.target.value||'Your post preview appears here...';document.getElementById('charcount').textContent=e.target.value.length+' / 2200 characters'});document.getElementById('postForm').addEventListener('submit',saveForm);document.getElementById('image').addEventListener('change',imagePreview)}else if(view==='analytics'){title('Content insights','A simple overview of your posting progress.');const total=posts.length||1;c.innerHTML=`<div class="stats">${[['Total posts',posts.length],['Scheduled',n.scheduled],['Published',n.published],['Needs attention',n.failed]].map(([a,b])=>`<div class="card stat"><label>${a}</label><strong>${b}</strong></div>`).join('')}</div><div class="two"><div class="card"><h2>Publishing progress</h2>${[['Published',n.published],['Scheduled',n.scheduled],['Draft',n.draft],['Needs attention',n.failed]].map(([a,b])=>`<div style="margin:21px 0"><div class="sectionhead"><span>${a}</span><b>${b}</b></div><div class="bar"><span style="width:${b/total*100}%"></span></div></div>`).join('')}</div><div class="card"><h2>Platform coverage</h2>${platforms.map(x=>`<div class="sectionhead" style="padding:13px 0;border-bottom:1px solid #29354e"><span>${x}</span><b>${posts.filter(p=>p.platforms.includes(x)).length} posts</b></div>`).join('')}<p class="muted" style="font-size:12px">Counts are from this browser only; these are not actual platform engagement analytics.</p></div></div>`}else if(view==='settings'){title('Workspace settings','Keep your charity’s content organized.');c.innerHTML=`<div class="two"><div class="card"><div class="field"><label for="charity">Charity name</label><input id="charity" value="${esc(settings.charity)}"></div><button class="btn primary" id="saveSettings">Save name</button><hr style="border:0;border-top:1px solid #34405a;margin:25px 0"><h2>Back up your content</h2><p class="muted">Download your local posts as a JSON backup or a CSV spreadsheet.</p><div class="actions"><button class="btn" id="exportJson">Export JSON</button><button class="btn" id="exportCsv">Export CSV</button><label class="btn">Import JSON <input type="file" id="importJson" accept="application/json,.json" hidden></label></div></div><div class="card"><h2>Security & limitations</h2><p class="muted" style="line-height:1.8">This GitHub Pages demo has no user accounts, backend, encrypted credential storage, API integrations, push notifications, or server-side scheduling. Do not enter passwords, access tokens, or private beneficiary information. Content is stored only in this browser. Clearing browser data can erase it.</p><button class="btn" id="demo">Load sample posts</button><button class="btn" id="clear" style="margin-left:8px">Clear all posts</button></div></div>`}bind()}function drawPosts(){const list=document.getElementById('postList');if(!list)return;const f=document.getElementById('filter').value,arr=posts.filter(p=>f==='all'||p.status===f).sort((a,b)=>new Date(a.date)-new Date(b.date));list.innerHTML=arr.length?arr.map(p=>postRow(p)+`<div class="actions" style="margin:-4px 0 10px 4px">${p.status!=='published'?`<button class="btn" data-publish="${p.id}">✓ Mark published</button>`:''}${p.status!=='failed'?`<button class="btn" data-fail="${p.id}">Flag issue</button>`:''}</div>`).join(''):'<div class="empty">No posts match this filter.</div>'}let imageData='';function imagePreview(e){const f=e.target.files[0];if(!f)return;if(f.size>700000){notify('Please choose an image smaller than 700 KB.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;const im=document.getElementById('previewImage');im.src=imageData;im.classList.remove('hide')};reader.readAsDataURL(f)}function saveForm(e){e.preventDefault();const ps=[...document.querySelectorAll('input[name=platform]:checked')].map(x=>x.value);if(!ps.length){notify('Choose at least one platform');return}const caption=document.getElementById('caption').value.trim(),date=document.getElementById('date').value,status=document.getElementById('status').value;if(!caption){notify('Write a caption');return}if(status==='scheduled'&&!date){notify('Choose a scheduled date');return}const existing=posts.find(p=>p.id===editing),p={id:existing?.id||String(Date.now()),caption,platforms:ps,date:date?new Date(date).toISOString():'',status,note:document.getElementById('note').value.trim(),image:imageData||existing?.image||''};if(existing)posts=posts.map(x=>x.id===p.id?p:x);else posts.push(p);try{save()}catch{notify('Browser storage full: try a smaller image');return}editing=null;imageData='';view='posts';render();notify('Post saved successfully')}function go(v){view=v;if(v==='compose'){editing=null;imageData=''}render();window.scrollTo(0,0)}function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{editing=x.dataset.edit;imageData='';view='compose';render()});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(confirm('Delete this post?')){posts=posts.filter(p=>p.id!==x.dataset.delete);save();render();notify('Post deleted')}});document.querySelectorAll('[data-publish]').forEach(x=>x.onclick=()=>{posts.find(p=>p.id===x.dataset.publish).status='published';save();render()});document.querySelectorAll('[data-fail]').forEach(x=>x.onclick=()=>{posts.find(p=>p.id===x.dataset.fail).status='failed';save();render()});const filter=document.getElementById('filter');if(filter)filter.onchange=()=>{drawPosts();bind()};for(const [id,delta] of [['prevMonth',-1],['nextMonth',1]]){const el=document.getElementById(id);if(el)el.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+delta,1);render()}}const today=document.getElementById('todayMonth');if(today)today.onclick=()=>{month=new Date();render()};const ss=document.getElementById('saveSettings');if(ss)ss.onclick=()=>{settings.charity=document.getElementById('charity').value.trim()||'My Charity';localStorage.setItem(SETTINGS,JSON.stringify(settings));notify('Workspace updated')};const ej=document.getElementById('exportJson');if(ej)ej.onclick=()=>download('kindly-backup.json',JSON.stringify(posts,null,2),'application/json');const ec=document.getElementById('exportCsv');if(ec)ec.onclick=()=>{const rows=[['Caption','Platforms','Date','Status','Notes'],...posts.map(p=>[p.caption,p.platforms.join('; '),p.date,p.status,p.note])];download('kindly-posts.csv',rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};const ij=document.getElementById('importJson');if(ij)ij.onchange=async e=>{try{const arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr)||!arr.every(p=>typeof p.caption==='string'&&Array.isArray(p.platforms)&&typeof p.status==='string'))throw Error();if(confirm('Replace your current posts with this backup?')){posts=arr.map(p=>({...p,id:String(p.id||Date.now()+Math.random())}));save();render();notify('Backup imported')}}catch{notify('Invalid backup file')}};const demo=document.getElementById('demo');if(demo)demo.onclick=()=>{if(posts.length&&!confirm('Add sample posts to your existing posts?'))return;const samples=[['Join us for our community food drive this Saturday! Every donation makes a difference.',['Instagram','Facebook'],1,'scheduled'],['Meet the volunteers making kindness happen in our neighbourhood. 💜',['LinkedIn','Facebook'],3,'scheduled'],['Thank you to everyone who supported our latest fundraiser!',['Instagram','X'],-2,'published'],['Behind the scenes: preparing care packages for local families.',['Instagram'],5,'draft']];posts.push(...samples.map((a,i)=>({id:String(Date.now()+i),caption:a[0],platforms:a[1],date:new Date(Date.now()+a[2]*86400000).toISOString(),status:a[3],note:'Sample post',image:''})));save();render();notify('Sample posts added')};const clear=document.getElementById('clear');if(clear)clear.onclick=()=>{if(confirm('Permanently delete all locally saved posts?')){posts=[];save();render();notify('Posts cleared')}}}function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.view));document.getElementById('newPost').onclick=()=>go('compose');render();</script></body></html>
